<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo AR - Laboratorio</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: Arial, sans-serif; }
        #canvas-ar { width: 100%; height: 100%; display: block; }
        #ar-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.8); z-index: 10;
        }
        .btn-inicio {
            padding: 20px 40px; font-size: 20px; font-weight: bold;
            color: white; background: #00FF00; border: none;
            border-radius: 8px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,255,0,0.4); color: #000;
        }
    </style>
</head>
<body>

    <!-- Pantalla de superposición que bloquea la app hasta presionar el botón -->
    <div id="ar-overlay">
        <button id="btn-iniciar-ar" class="btn-inicio">Iniciar AR</button>
    </div>

    <!-- Canvas donde Three.js y LocAR renderizarán la cámara y el modelo 3D -->
    <canvas id="canvas-ar"></canvas>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
